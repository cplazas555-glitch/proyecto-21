
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Pomodoro</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">
        <h1>🍅 Temporizador Pomodoro</h1>

        <h2 id="tipo">Tiempo de trabajo</h2>

        <div id="tiempo">25:00</div>

        <p>Sesiones completadas: <span id="sesiones">0</span></p>

        <div class="botones">
            <button onclick="iniciar()">Iniciar</button>
            <button onclick="pausar()">Pausar</button>
            <button onclick="reiniciar()">Reiniciar</button>
        </div>

        <h3>Configurar tiempos</h3>

        <label>Trabajo (minutos):</label>
        <input type="number" id="trabajo" value="25" min="1">

        <label>Descanso corto:</label>
        <input type="number" id="corto" value="5" min="1">

        <label>Descanso largo:</label>
        <input type="number" id="largo" value="15" min="1">

        <button onclick="guardar()">Guardar tiempos</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
